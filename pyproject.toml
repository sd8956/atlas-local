[project]
name = "atlas-local"
version = "0.1.0"
description = "Operator-run local AWS remediation pilot scaffold"
requires-python = ">=3.14"
dependencies = ["typer>=0.12", "pydantic>=2", "rich>=13", "boto3>=1.34", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atlas = "atlas_local.cli.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
